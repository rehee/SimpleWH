services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_DB: warehouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U warehouse -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 15
    security_opt:
      - no-new-privileges:true
  app:
    image: ${APP_IMAGE:-ghcr.io/rehee/simplewh:latest}
    restart: unless-stopped
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DATABASE_URL: postgresql://warehouse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/warehouse
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - warehouse-data:/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-6001}:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
volumes:
  warehouse-data:
  postgres-data:
